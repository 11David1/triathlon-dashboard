# training.example.org durch die eigene Domain ersetzen.
limit_req_zone $binary_remote_addr zone=tri_login:1m rate=6r/m;

# Anfragen an die IP oder fremde Hostnamen bekommen gar kein Zertifikat zu sehen.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name training.example.org;

    ssl_certificate /etc/letsencrypt/live/training.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/training.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;

    # Wer http:// auf dem TLS-Port aufruft, landet auf der richtigen Adresse.
    error_page 497 =301 https://training.example.org$request_uri;

    location = /api/login {
        limit_req zone=tri_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/knowledge/file {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
