<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Anmelden · Trainings-Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
<form id="login" class="card login-card">
  <h1>Trainings-Dashboard</h1>
  <div id="step-login">
    <label for="username">Benutzername</label>
    <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Passwort oder Startcode</label>
    <input id="password" type="password" autocomplete="current-password" required>
  </div>
  <div id="step-setup" hidden>
    <p>Willkommen! Bitte lege jetzt dein eigenes Passwort fest. Der Startcode gilt danach nicht mehr.</p>
    <label for="new-password">Neues Passwort</label>
    <input id="new-password" type="password" autocomplete="new-password">
    <label for="new-password-2">Noch einmal</label>
    <input id="new-password-2" type="password" autocomplete="new-password">
  </div>
  <p id="error" class="error" role="alert" hidden></p>
  <button id="submit" class="primary" type="submit">Anmelden</button>
</form>
<script src="/static/login.js"></script>
</body>
</html>
